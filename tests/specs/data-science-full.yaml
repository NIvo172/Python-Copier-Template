dependency_groups:
  dev:
  - pytest-sugar
  - tox
  - tox-uv
  docs:
  - furo
  - matplotlib
  - myst-nb
  - myst-parser
  - pylint
  - sphinx
  - sphinx-copybutton
  - sphinx-gallery
  - sphinx-inline-tabs
  - sphinxcontrib-mermaid
  dvc:
  - dvc
  lint:
  - format-docstring
  - mypy
  - nbstripout
  - pre-commit
  - pytest
  - ruff
  - types-PyYAML
  notebooks:
  - ipykernel
  - jupyterlab
  package-check:
  - check-wheel-contents
  - twine
  test:
  - pytest
  - pytest-cov
  - pytest-datadir
  - pytest-html
  - pytest-mock
  - pytest-reportlog
  - pytest-xdist
per_file_ignores_keys:
- docs/source/conf.py
- docs/source/notebooks/**/*.ipynb
- examples/**/*.py
- notebooks/**/*.ipynb
- scripts/**/*.py
- src/**/main.py
- tests/**/*.py
precommit_hooks:
  default:
  - check-added-large-files
  - check-case-conflict
  - check-illegal-windows-names
  - check-json
  - check-merge-conflict
  - check-toml
  - check-yaml
  - debug-statements
  - detect-private-key
  - end-of-file-fixer
  - format-docstring
  - format-docstring-jupyter
  - mixed-line-ending
  - name-tests-test
  - nbstripout
  - ruff-check
  - ruff-format
  - trailing-whitespace
  manual:
  - check-added-large-files
  - check-case-conflict
  - check-illegal-windows-names
  - check-json
  - check-merge-conflict
  - check-toml
  - check-yaml
  - debug-statements
  - detect-private-key
  - end-of-file-fixer
  - mixed-line-ending
  - name-tests-test
  - trailing-whitespace
ruff_select:
- ANN
- B
- C4
- D
- DTZ
- E4
- E7
- E9
- F
- G
- I
- ICN
- LOG
- NPY
- PTH
- RUF
- S
- SIM
- T20
- UP
tox_environments:
- build
- clean
- docs
- dvc
- lint
- lock
- notebooks
- package-check
- pre-commit
- py311
- py312
- py313
- py314
- repo-checks
- uml
