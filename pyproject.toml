[project]
name = "python-project-copier-template"
version = "0.1.0"
description = "Copier template for modern pure-Python projects"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docs = [
    "furo>=2025.7",
    "myst-parser>=4,<6",
    "sphinx>=8,<10",
    "sphinx-copybutton>=0.5,<1",
]
dev = [
    "copier>=9.17,<10",
    "jinja2>=3.1",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pyyaml>=6.0",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 121

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
