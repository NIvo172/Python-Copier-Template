name: Template CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --group docs
      - name: Run template tests (with coverage gate)
        env:
          # CI runs the full slow tier, including the one-time normal-project
          # lifecycle (it bootstraps a real repo and runs the generated Tox suite).
          RUN_NORMAL_PROJECT: "1"
        run: uv run --locked pytest --cov-fail-under=80
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Build template documentation
        run: >-
          uv run --locked --group docs sphinx-build
          -W --keep-going
          -b html
          docs
          reports/sphinx/html
